[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[runner]
fastReruns = true

[theme]
base = "light"
primaryColor = "#F28C74"
backgroundColor = "#F4F7F6"
secondaryBackgroundColor = "#2B2B36"
textColor = "#2C313C"
font = "sans serif"

